name: Dispatch 0.4.0-beta.1 release once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-0.4.0-beta.1.yml"

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Start release workflow for existing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref main -f release_ref=0.4.0-beta.1

      - name: Remove one-shot dispatcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-0.4.0-beta.1.yml
          git commit -m "Remove one-shot 0.4.0-beta.1 release dispatcher"
          git push origin HEAD:main
