name: Initiate 0.4.0-beta.1 once

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  tag-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == '0dffde8e3a46673f6f02decc3fd36efe85cff48a'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Tag release commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin refs/tags/0.4.0-beta.1 >/dev/null 2>&1; then
            echo "Tag 0.4.0-beta.1 already exists"
          else
            git tag 0.4.0-beta.1 0dffde8e3a46673f6f02decc3fd36efe85cff48a
            git push origin 0.4.0-beta.1
          fi

      - name: Remove one-shot initiator
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/initiate-0.4.0-beta.1.yml
          git commit -m "Remove one-shot 0.4.0-beta.1 release initiator"
          git push origin HEAD:main
