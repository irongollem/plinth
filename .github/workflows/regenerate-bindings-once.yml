name: Regenerate bindings once

on:
  push:
    branches:
      - claude/issue-7-release-completeness

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/issue-7-release-completeness

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Regenerate Specta bindings
        run: cargo test --verbose
        working-directory: src-tauri

      - name: Commit generated bindings
        shell: bash
        run: |
          if git diff --quiet -- src/bindings.ts; then
            echo "Bindings already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bindings.ts
          git commit -m "chore: regenerate Specta bindings"
          git push origin HEAD:claude/issue-7-release-completeness
