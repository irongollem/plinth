name: Create 0.4.0-beta.1 draft release once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/create-0.4.0-beta.1-release-once.yml"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove bootstrap workflow first
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/create-0.4.0-beta.1-release-once.yml
          git commit -m "Remove 0.4.0-beta.1 release bootstrap"
          git push origin HEAD:main

      - name: Wait until default-branch workflows match the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 20); do
            if ! gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/create-0.4.0-beta.1-release-once.yml?ref=main" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "Bootstrap workflow is still visible on main" >&2
          exit 1

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/0.4.0-beta.1" >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="0.4.0-beta.1" \
            -f name="Plinth v0.4.0-beta.1" \
            -f body="Release assets are being built by GitHub Actions." \
            -F draft=true \
            -F prerelease=true
